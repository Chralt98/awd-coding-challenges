info:
  name: Request Chat Completion
  type: http
  seq: 1

http:
  method: POST
  url: https://api.openai.com/v1/chat/completions
  body:
    type: json
    data: |-
      {
        "model": "gpt-4o-mini",
        "messages": [
          { "role": "user", "content": "Explain what an API is in one sentence." },
          { "role": "assistant", "content": "An API, or Application Programming Interface, is a set of rules and protocols that allows different software applications to communicate and interact with each other." },
          { "role": "user", "content": "Thanks, I understand now!"}
        ]
      }
  auth:
    type: bearer
    token: "{{process.env.OPENAI_API_KEY}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
