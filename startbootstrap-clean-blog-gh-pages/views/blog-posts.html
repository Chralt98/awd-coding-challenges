{% extends "index.html" %}
{% block postsBlock %}
  {% for post in posts %}
    <hr class="my-4" />
    <!-- Post preview-->
    <div class="post-preview">
      <a href="post.html">
        <h2 class="post-title">{{ post.title }}</h2>
        <h3 class="post-subtitle">{{ post.teaser }}</h3>
      </a>
      <p class="post-meta">
        Posted by
        <a href="#!">{{ post.author }}</a>
        on {{ post.date }}
      </p>
    </div>
  {% endfor %}
{% endblock %}
