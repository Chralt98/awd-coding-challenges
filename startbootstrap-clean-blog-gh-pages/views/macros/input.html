{% macro input(label, placeholder, type) %}
  {% if type === "textarea" %}
    <textarea
      class="form-control"
      id="message"
      placeholder="{{ placeholder }}"
      style="height: 12rem"
      data-sb-validations="required"
    ></textarea>
  {% else %}
    <input
      class="form-control"
      id="name"
      type="{{ label }}"
      placeholder="{{ placeholder }}"
      data-sb-validations="required"
    />
  {% endif %}
{% endmacro %}
