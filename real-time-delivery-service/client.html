<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Delivery Tracker</title>
  </head>
  <body>
    <h1>Delivery Tracker</h1>
    <button id="create-short-polling-order">Create Short Polling Order</button>
    <button id="create-long-polling-order">Create Long Polling Order</button>
    <div id="order-info" hidden>
      <p>Order ID: <span id="order-id"></span></p>
      <p>Stage: <span id="order-stage"></span></p>
    </div>

    <script>
      const createShortPollingBtn = document.getElementById(
        "create-short-polling-order",
      );
      const orderInfo = document.getElementById("order-info");
      const orderIdSpan = document.getElementById("order-id");
      const orderStageSpan = document.getElementById("order-stage");

      const createLongPollingBtn = document.getElementById(
        "create-long-polling-order",
      );

      createShortPollingBtn.addEventListener("click", async () => {
        const res = await fetch("/api/orders", { method: "POST" });
        const { id } = await res.json();

        orderIdSpan.textContent = id;
        orderInfo.hidden = false;

        shortPolling(id);
      });

      createLongPollingBtn.addEventListener("click", async () => {
        const res = await fetch("/api/orders", { method: "POST" });
        const { id } = await res.json();

        orderIdSpan.textContent = id;
        orderInfo.hidden = false;

        longPolling(id);
      });

      function shortPolling(id) {
        const interval = setInterval(async () => {
          const res = await fetch(`/api/orders/${id}`);
          const { stage } = await res.json();

          orderStageSpan.textContent = stage;

          if (stage === "delivered") {
            clearInterval(interval);
          }
        }, 1000);
      }

      async function longPolling(id) {
        while (true) {
          const res = await fetch(
            `/api/orders/${id}/updates?lastStage=${orderStageSpan.textContent}`,
          );
          const { stage } = await res.json();

          orderStageSpan.textContent = stage;

          if (stage === "delivered") break;
        }
      }
    </script>
  </body>
</html>
